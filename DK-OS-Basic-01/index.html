<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DK-OS BASIC</title>

    <style>
        :root {
            --bg: #000;
            --fg: #33ff33;
            --accent: lightsalmon;
            --dim: #1f8b1f;
            --err: #ff5f5f;
            --chrome: 1px solid var(--fg);
        }

        * { box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--fg);
            font-family: "DejaVu Sans Mono", "Cascadia Mono", Consolas, monospace;
            font-size: 15px;
            line-height: 1.35;
            overflow: hidden;
        }

        [hidden] { display: none !important; }

        /* The CRT frame: status bar pinned to the top, the active screen
           filling the rest. Grid rather than absolute positioning so the screen
           area gets the leftover height without any measuring in script. */
        #crt {
            position: relative;
            height: 100dvh;
            display: grid;
            grid-template-rows: auto 1fr;
            padding: 10px;
            gap: 8px;
        }

        /* Scanline overlay. pointer-events:none keeps it from eating clicks
           meant for the UI underneath. */
        #crt::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: repeating-linear-gradient(
                to bottom,
                rgba(0, 0, 0, 0) 0px,
                rgba(0, 0, 0, 0) 2px,
                rgba(0, 0, 0, 0.25) 3px,
                rgba(0, 0, 0, 0.25) 4px
            );
            z-index: 10;
        }

        #status-bar {
            border: var(--chrome);
            padding: 4px 8px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
        }

        #status-bar .title { color: var(--accent); }

        .screen {
            min-height: 0; /* lets the grid row shrink so children can scroll */
            overflow: auto;
        }

        /* A screen made of panels stacks them above the key bar. */
        .tui-screen {
            display: grid;
            grid-template-rows: 1fr auto;
            gap: 8px;
            height: 100%;
            outline: none;
        }

        /* ------------------------------------------------------- bootloader */

        #bootloader {
            display: flex;
            flex-direction: column;
            gap: 18px;
            border: var(--chrome);
            padding: 10px;
        }

        #bootloader h1 {
            margin: 0;
            font-size: 1.6em;
            color: var(--accent);
            letter-spacing: 6px;
        }

        #bootloader .tagline { margin: 0; color: var(--dim); }

        #boot-log { margin: 0; white-space: pre-wrap; font: inherit; }

        /* The cursor chasing the boot log, so the screen never looks frozen. */
        #boot-log::after {
            content: "\2588";
            animation: blink 1s steps(1, end) infinite;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        /* ------------------------------------------------------ TUI panels */

        .tui-columns {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr);
            gap: 8px;
            min-height: 0;
        }

        /* The panel frame. The title sits on the top border the way a
           box-drawn caption does: pulled up by half a line, with the border
           showing through the gap either side of its padding. */
        .tui-panel {
            position: relative;
            border: var(--chrome);
            padding: 14px 10px 10px;
            min-height: 0;
            display: flex;
            flex-direction: column;
            overflow: auto;
        }

        .tui-panel-title {
            position: absolute;
            top: 0;
            left: 10px;
            transform: translateY(-50%);
            margin: 0;
            font-size: 1em;
            font-weight: normal;
            color: var(--accent);
            background: var(--bg);
        }

        .tui-panel-body { min-height: 0; flex: 1; }

        /* --------------------------------------------------------- the menu */

        .tui-menu {
            list-style: none;
            margin: 0;
            padding: 0;
            outline: none;
        }

        .tui-menu-item {
            display: flex;
            gap: 8px;
            padding: 2px 6px;
            cursor: pointer;
            white-space: pre;
        }

        .tui-pointer { width: 1ch; color: var(--accent); }

        .tui-label { flex: 1; }

        .tui-hint { color: var(--dim); }

        /* Selected-but-unfocused is outlined; selected-and-focused inverts,
           which is exactly how a text-mode list shows where the keyboard is. */
        .tui-menu-item.is-selected {
            outline: 1px solid var(--dim);
            outline-offset: -1px;
        }

        .tui-menu-item.is-active {
            background: var(--fg);
            color: var(--bg);
            outline: none;
        }

        .tui-menu-item.is-active .tui-pointer,
        .tui-menu-item.is-active .tui-hint { color: var(--bg); }

        /* ------------------------------------------------------ the details */

        .tui-detail-name {
            color: var(--accent);
            margin-bottom: 8px;
        }

        .tui-detail-body {
            margin: 0;
            font: inherit;
            white-space: pre-wrap;
            color: var(--fg);
        }

        /* ------------------------------------------------------- the keybar */

        .tui-keybar {
            border: var(--chrome);
            padding: 4px 8px;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .tui-keybar-item { display: flex; gap: 6px; }

        .tui-key {
            background: var(--fg);
            color: var(--bg);
            padding: 0 4px;
        }

        .tui-action { color: var(--dim); }

        /* -------------------------------------------------------- terminal */

        #terminal-app { border: var(--chrome); padding: 10px; }

        .terminal {
            height: 100%;
            outline: none;
            cursor: text;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .term-line { min-height: 1.35em; }
        .term-line.err { color: var(--err); }
        .term-line.accent { color: var(--accent); }
        .term-line.dim { color: var(--dim); }

        .term-prompt { color: var(--accent); }

        /* A block cursor: the character underneath is inverted, which is what
           makes it read as a terminal caret rather than a text selection. */
        .term-cursor {
            background: var(--fg);
            color: var(--bg);
            animation: blink 1.1s steps(1, end) infinite;
        }

        /* A terminal that isn't listening shouldn't pretend it is. */
        .terminal:not(:focus) .term-cursor {
            animation: none;
            background: transparent;
            color: var(--fg);
            outline: 1px solid var(--dim);
        }

        /* Narrow screens: one column instead of two. */
        @media (max-width: 640px) {
            .tui-columns { grid-template-columns: minmax(0, 1fr); }
        }

        /* Scrollbars. Firefox takes the two-value shorthand; Chrome, Edge and
           Safari need the ::-webkit-scrollbar pseudo-elements. Both are listed
           so the bar matches the terminal palette everywhere. */
        * {
            scrollbar-color: var(--accent) var(--bg);
            scrollbar-width: thin;
        }

        ::-webkit-scrollbar { width: 12px; height: 12px; }
        ::-webkit-scrollbar-track { background: var(--bg); border-left: var(--chrome); }
        ::-webkit-scrollbar-thumb { background: var(--accent); border: var(--chrome); }
        ::-webkit-scrollbar-thumb:hover { background: var(--fg); }
        ::-webkit-scrollbar-corner { background: var(--bg); }

        /* Motion-sensitive users still get the UI, minus the flicker. */
        @media (prefers-reduced-motion: reduce) {
            .term-cursor, #boot-log::after { animation: none; }
        }
    </style>
</head>
<body>

    <div id="crt">

        <!-- hidden until the screen controller shows it, so the engine owns
             every screen on the page rather than most of them. -->
        <div id="status-bar" hidden>
            <span class="title">DK-OS BASIC</span>
            <span id="screen-name">BOOT</span>
            <span>System time: <span id="clock">--:--:--</span></span>
        </div>

        <div id="bootloader" hidden class="screen">
            <div>
                <h1>DK OS</h1>
                <p class="tagline">Project Futureon</p>
            </div>
            <pre id="boot-log"></pre>
        </div>

        <!-- Each screen below builds its own innards; these are mount points. -->
        <div id="home" hidden class="screen"></div>

        <div id="terminal-app" hidden class="screen">
            <div id="terminal"></div>
        </div>

        <div id="game-player" hidden class="screen" tabindex="-1"></div>
        <div id="draw-app" hidden class="screen" tabindex="-1"></div>
        <div id="pictures-app" hidden class="screen" tabindex="-1"></div>
        <div id="settings-app" hidden class="screen" tabindex="-1"></div>

    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
