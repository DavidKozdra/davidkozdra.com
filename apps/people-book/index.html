<!doctype html>
<html lang="en">
  <head>
    <!-- Favicon  -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/assets/images/ui-icons/peoplebook.svg"
    />
    <script>
      if (window.self !== window.top) {
        document.documentElement.classList.add("is-embedded");
      }
    </script>
    <link
      rel="stylesheet"
      type="text/css"
      href="style.css?v=20260722-14"
    />


    <!-- Playables SDK -->
    <script src="playables-sdk.js?v=20260720-2"></script>
    <script src="chatOptions.js?v=20260720-6"></script>

    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#5865F2" />

    <title>Contact Connect</title>
    
  </head>
  <body>
    <div class="app" id="app">
      <div class="streak-banner" id="streakBanner"></div>

      <header class="topbar">
        <div class="stat" id="statCoins">
          <span class="icon">🪙</span><span class="value" id="coinsVal">0</span>
        </div>
        <div class="xp-bar-wrap" title="XP to next level">
          <div class="xp-bar" id="xpBar"></div>
        </div>
        <div class="stat" id="statLevel">
          <span class="icon">⭐</span
          ><span class="value">Lv <span id="levelVal">1</span></span>
        </div>
        <div class="stat">
          <span class="icon">👥</span
          ><span class="value" id="contactsVal">0</span>
        </div>
      </header>

      <nav class="tabs">
        <button class="tab active" data-view="people" id="tabPeople">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
            <path d="M16 3.13a4 4 0 0 1 0 7.75" />
          </svg>
          People
        </button>
        <button class="tab" data-view="chats" id="tabChats">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"
            />
          </svg>
          Chats
        </button>
        <button class="tab" data-view="feed" id="tabFeed">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <rect x="2" y="3" width="20" height="14" rx="2" />
            <line x1="8" y1="21" x2="16" y2="21" />
            <line x1="12" y1="17" x2="12" y2="21" />
          </svg>
          Feed
        </button>
        <button class="tab" data-view="shop" id="tabShop">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z" />
            <line x1="3" y1="6" x2="21" y2="6" />
            <path d="M16 10a4 4 0 0 1-8 0" />
          </svg>
          Shop
        </button>
        <button class="tab" data-view="games" id="tabGames">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="6" width="18" height="12" rx="3" />
            <path d="M7 12h4M9 10v4M16 11h.01M18 13h.01" />
          </svg>
          Game
        </button>
      </nav>

      <!-- People View -->
      <div class="view active" id="viewPeople">
        <main class="game">
          <div class="card-container">
            <div class="card" id="contactCard">
              <div class="avatar-wrap">
                <img class="avatar" id="avatar" src="" alt="avatar" />
                <div class="online-dot"></div>
              </div>
              <h2 class="name" id="contactName">Loading...</h2>
              <p class="status" id="contactStatus">Generating contact</p>
              <div class="actions">
                <button class="btn btn-add" id="btnAdd">
                  + Add Friend (+10)
                </button>
                <button class="btn btn-skip" id="btnSkip">Skip</button>
                <button class="btn btn-msg" id="btnMsg">Message</button>
              </div>
            </div>
          </div>
        </main>
        <aside class="contacts-panel">
          <div class="panel-title">
            <span>Friends</span>
            <span id="contactCount">0</span>
          </div>
          <div class="contacts-list" id="contactsList">
            <div class="empty-contacts">No friends yet</div>
          </div>
        </aside>
      </div>

      <!-- Chats View -->
      <div class="view" id="viewChats">
        <div class="chats-list" id="chatsList">
          <div class="chats-empty">
            No conversations yet. Add friends and message them!
          </div>
        </div>
      </div>

      <!-- Feed View -->
      <div class="view" id="viewFeed">
        <div class="feed-view" id="feedList"></div>
      </div>

      <!-- Shop View -->
      <div class="view" id="viewShop">
        <div class="shop-view">
          <div class="shop-header">
            <div class="char-preview">
              <div class="char-canvas" id="charPreview"></div>
              <div class="char-label">Your Character</div>
            </div>
            <h2>Cosmetics Shop</h2>
            <div class="shop-coins">🪙 <span id="shopCoins">0</span> coins</div>
          </div>
          <div id="shopSections"></div>
        </div>
      </div>

      <!-- Games View -->
      <div class="view" id="viewGames">
        <div class="games-view">
          <div class="games-heading">
            <div>
              <p class="games-eyebrow">ARCADE LIBRARY</p>
              <h2>Challenge your friends</h2>
              <p>Every contact has their own hidden play style.</p>
            </div>
            <div class="games-wallet">🪙 <span id="gamesCoins">0</span></div>
          </div>
          <label class="game-search-wrap" for="gameSearch">
            <span>⌕</span>
            <input id="gameSearch" type="search" placeholder="Search your games..." autocomplete="off" />
          </label>
          <div class="games-library" id="gamesLibrary"></div>
        </div>
      </div>

      <!-- DM Overlay -->
      <div class="dm-overlay" id="dmOverlay">
        <div class="dm-panel">
          <div class="dm-header">
            <img class="dm-header-avatar" id="dmAvatar" src="" alt="" />
            <div class="dm-header-details">
              <div class="dm-header-name" id="dmName"></div>
              <div class="dm-header-status" id="dmStatus">Online</div>
            </div>
            <button class="dm-close" id="dmClose">&times;</button>
          </div>
          <div class="dm-messages" id="dmMessages"></div>
          <div class="dm-typing" id="dmTyping"></div>
          <div class="dm-input-bar">
            <input
              class="dm-input"
              id="dmInput"
              type="text"
              placeholder="Message..."
              maxlength="200"
              autocomplete="off"
            />
            <button class="dm-send" id="dmSend">&#9654;</button>
          </div>
        </div>
      </div>

      <!-- Challenge / playable overlays -->
      <div class="game-modal" id="gameModal" aria-hidden="true">
        <div class="game-modal-card">
          <button class="game-modal-close" id="gameModalClose" aria-label="Close">&times;</button>
          <div id="gameModalContent"></div>
        </div>
      </div>
      <div class="playable-overlay" id="playableOverlay" aria-hidden="true">
        <div class="playable-shell">
          <div class="playable-bar">
            <div><strong id="playableTitle">Game</strong><span id="playableOpponent"></span></div>
            <button id="playableClose">Leave match</button>
          </div>
          <iframe id="playableFrame" title="People Book game" allow="fullscreen"></iframe>
        </div>
      </div>

      <div class="toast" id="toast"></div>
    </div>

    <script src="app.js?v=20260720-13"></script>
  </body>
</html>
