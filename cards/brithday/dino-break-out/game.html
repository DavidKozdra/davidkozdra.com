<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dino Break-Out — David's Birthday</title>
  <meta name="robots" content="noindex">
  <style>
    :root {
      color-scheme: light;
      --forest: #0f3d2e;
      --gold: #d4af37;
      --gold-light: #f1d98a;
      --cream: #f6f0e4;
      --paper: #fffdf7;
      --ink-muted: #527064;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 320px;
      padding: 16px 16px 20px;
      overflow: hidden;
      color: var(--forest);
      background:
        radial-gradient(circle at 15% 12%, rgba(212, 175, 55, .14), transparent 25rem),
        radial-gradient(circle at 85% 84%, rgba(15, 61, 46, .11), transparent 29rem),
        var(--cream);
      font-family: Georgia, "Times New Roman", serif;
    }

    .game-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      width: 100%;
      max-width: 480px;
      margin-bottom: 10px;
    }

    .game-title {
      margin: 0;
      font-family: "URW Chancery L", "Apple Chancery", "Segoe Script", cursive;
      font-size: clamp(1.6rem, 6vw, 2.2rem);
      font-weight: 400;
      line-height: 1;
    }

    .back-link {
      padding-bottom: 3px;
      color: var(--forest);
      border-bottom: 1px solid var(--gold);
      font-family: Arial, Helvetica, sans-serif;
      font-size: .62rem;
      font-weight: 700;
      letter-spacing: .17em;
      text-decoration: none;
      text-transform: uppercase;
    }

    .back-link:focus-visible {
      outline: 3px solid var(--gold-light);
      outline-offset: 4px;
    }

    #game {
      flex: 1;
      width: 100%;
      max-width: 480px;
      min-height: 0;
    }

    #game canvas {
      display: block;
      margin: 0 auto;
      border: 1px solid rgba(212, 175, 55, .7);
      border-radius: 14px;
      box-shadow:
        0 0 0 5px var(--paper),
        0 0 0 6px rgba(212, 175, 55, .45),
        0 24px 50px rgba(15, 61, 46, .16);
      touch-action: none;
    }

    .game-help {
      margin: 14px 0 0;
      color: var(--ink-muted);
      font-size: .85rem;
      font-style: italic;
      text-align: center;
    }
  </style>
</head>
<body>
  <header class="game-header">
    <h1 class="game-title">Dino Break-Out</h1>
    <a class="back-link" href="../games.html">Back to games</a>
  </header>

  <main id="game" aria-label="Dino Break-Out game"></main>

  <p class="game-help">Move to steer the paddle · tap or click to launch · Esc to pause</p>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
