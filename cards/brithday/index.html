  <style>
    :root {
      color-scheme: light;
      --forest: #0f3d2e;
      --forest-light: #1f664d;
      --gold: #d4af37;
      --gold-light: #f1d98a;
      --cream: #f6f0e4;
      --paper: #fffdf7;
      --ink-muted: #527064;
      --card-width: min(460px, calc(100vw - 46px));
      --card-height: min(690px, calc(100dvh - 48px));
      --ease-card: cubic-bezier(.22, .75, .18, 1);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--cream);
    }

    body {
      min-width: 320px;
      min-height: 100%;
      margin: 0;
      overflow-x: hidden;
      color: var(--forest);
      background:
        radial-gradient(circle at 15% 12%, rgba(212, 175, 55, .14), transparent 25rem),
        radial-gradient(circle at 85% 84%, rgba(15, 61, 46, .11), transparent 29rem),
        var(--cream);
      font-family: Georgia, "Times New Roman", serif;
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: -1;
      content: "";
      pointer-events: none;
      opacity: .36;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.72' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.1'/%3E%3C/svg%3E");
      mix-blend-mode: multiply;
    }

    button,
    a {
      font: inherit;
    }

    button {
      color: inherit;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 3px solid var(--gold-light);
      outline-offset: 4px;
    }

    .confetti-canvas {
      position: fixed;
      inset: 0;
      z-index: 50;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .confetti-canvas.is-raining {
      z-index: 0;
    }

    .stage {
      position: relative;
      z-index: 1;
      display: grid;
      min-height: 100svh;
      place-items: center;
      padding: 24px;
    }

    .card-scene {
      position: relative;
      width: min(100%, 1020px);
      height: var(--card-height);
      min-height: 570px;
      perspective: 2200px;
      perspective-origin: 50% 46%;
    }

    .card {
      position: absolute;
      top: 0;
      left: 50%;
      width: var(--card-width);
      height: 100%;
      transform: translateX(-50%);
      transform-style: preserve-3d;
      transition: transform 1s var(--ease-card);
    }

    .card-scene.is-open .card {
      transform: translateX(0);
    }

    .panel {
      position: absolute;
      inset: 0;
      border: 1px solid rgba(15, 61, 46, .72);
      border-radius: 5px 22px 22px 5px;
      box-shadow:
        0 0 0 1px var(--paper),
        0 0 0 5px var(--cream),
        0 0 0 6px rgba(212, 175, 55, .82),
        0 28px 72px rgba(15, 61, 46, .17);
    }

    .inside-panel {
      z-index: 1;
      overflow: hidden auto;
      padding: clamp(26px, 5vh, 43px) clamp(24px, 7vw, 42px) 28px;
      text-align: center;
      background:
        linear-gradient(100deg, rgba(15, 61, 46, .075), transparent 9%),
        var(--paper);
      scrollbar-width: thin;
      scrollbar-color: rgba(212, 175, 55, .55) transparent;
    }

    .inside-panel::before,
    .cover-face::before {
      position: absolute;
      inset: 11px;
      content: "";
      pointer-events: none;
      border: 1px solid rgba(212, 175, 55, .38);
      border-radius: 2px 14px 14px 2px;
    }

    .cover {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: block;
      width: 100%;
      height: 100%;
      padding: 0;
      border: 0;
      border-radius: 5px 22px 22px 5px;
      background: transparent;
      cursor: pointer;
      transform: rotateY(0deg);
      transform-origin: left center;
      transform-style: preserve-3d;
      transition: transform 1s var(--ease-card);
    }

    .card-scene.is-open .cover {
      transform: rotateY(-180deg);
    }

    .cover-face {
      position: absolute;
      inset: 0;
      display: flex;
      overflow: hidden;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      border: 1px solid var(--forest);
      border-radius: inherit;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      box-shadow:
        0 0 0 1px var(--paper),
        0 0 0 5px var(--cream),
        0 0 0 6px var(--gold),
        0 28px 72px rgba(15, 61, 46, .18);
      transition: box-shadow .25s ease;
    }

    .cover-front {
      padding: 36px 34px 30px;
      background:
        radial-gradient(circle at 50% 53%, rgba(212, 175, 55, .12), transparent 16rem),
        linear-gradient(145deg, rgba(255, 255, 255, .45), transparent 45%),
        var(--paper);
    }

    .cover-front::before {
      border-color: rgba(212, 175, 55, .45);
    }

    .cover-back {
      padding: 42px 34px;
      background:
        linear-gradient(260deg, rgba(15, 61, 46, .07), transparent 12%),
        var(--paper);
      transform: rotateY(180deg);
    }

    .cover-content,
    .back-content {
      position: relative;
      z-index: 1;
      width: 100%;
      text-align: center;
    }

    .invite-script {
      margin: 0 0 14px;
      color: var(--gold);
      font-family: "URW Chancery L", "Apple Chancery", "Segoe Script", cursive;
      font-size: clamp(2rem, 7vw, 3.3rem);
      font-weight: 400;
      line-height: 1;
    }

    .cover-kicker,
    .eyebrow,
    .detail-label {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      font-size: .67rem;
      font-weight: 700;
      letter-spacing: .24em;
      line-height: 1.35;
      text-transform: uppercase;
    }

    .cover-kicker {
      color: rgba(15, 61, 46, .56);
    }

    .cover-title {
      margin: 12px 0 16px;
      color: var(--forest);
      font-size: clamp(1.6rem, 6vw, 2.4rem);
      font-weight: 600;
      letter-spacing: .07em;
      line-height: 1.08;
      text-transform: uppercase;
    }

    .cover-title span {
      display: block;
      margin-top: 8px;
      color: var(--gold);
      font-size: .65em;
      letter-spacing: .18em;
    }

    .dino-art-wrap {
      position: relative;
      display: block;
      width: min(100%, 310px);
      margin: 10px auto 12px;
    }

    .dino-art-wrap::before {
      position: absolute;
      right: 4%;
      bottom: 3%;
      left: 4%;
      height: 16px;
      content: "";
      border-radius: 50%;
      background: rgba(15, 61, 46, .13);
      filter: blur(8px);
    }

    .dino-art {
      position: relative;
      display: block;
      width: 100%;
      max-height: 280px;
      margin: auto;
      object-fit: contain;
      filter: drop-shadow(0 12px 15px rgba(15, 61, 46, .16));
      mix-blend-mode: multiply;
      transform: translateZ(1px);
      user-select: none;
    }

    .theme-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 34px;
      padding: 7px 18px;
      color: var(--paper);
      border-radius: 999px;
      background: var(--forest);
      font-family: Arial, Helvetica, sans-serif;
      font-size: .68rem;
      font-weight: 800;
      letter-spacing: .19em;
      text-transform: uppercase;
      box-shadow: 0 3px 0 rgba(0, 0, 0, .15);
    }

    .theme-pill::before,
    .theme-pill::after {
      content: "•";
      color: var(--gold-light);
    }

    .cover-subtitle {
      display: block;
      margin: 12px auto 0;
      color: var(--ink-muted);
      font-size: .85rem;
      font-style: italic;
      letter-spacing: .025em;
    }

    .open-cue {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin-top: clamp(17px, 3vh, 25px);
      color: rgba(15, 61, 46, .64);
      font-family: Arial, Helvetica, sans-serif;
      font-size: .67rem;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .open-cue svg {
      width: 17px;
      transition: transform .25s ease;
    }

    @media (hover: hover) and (pointer: fine) {
      .card-scene:not(.is-open) .cover:hover .cover-front {
        box-shadow:
          0 0 0 1px var(--paper),
          0 0 0 5px var(--cream),
          0 0 0 7px var(--gold),
          0 32px 78px rgba(15, 61, 46, .22);
      }

      .card-scene:not(.is-open) .cover:hover .open-cue svg {
        transform: translateX(4px);
      }
    }

    .back-flourish {
      display: block;
      width: 72px;
      margin: 0 auto 28px;
      color: var(--gold);
    }

    .back-title {
      margin: 0;
      color: var(--forest);
      font-family: "URW Chancery L", "Apple Chancery", "Segoe Script", cursive;
      font-size: clamp(2.1rem, 5vw, 3.1rem);
      font-weight: 400;
      line-height: 1.12;
    }

    .back-drinks {
      display: block;
      width: min(100%, 320px);
      max-height: 190px;
      margin: 18px auto 5px;
      object-fit: contain;
      filter: drop-shadow(0 12px 13px rgba(15, 61, 46, .14));
      user-select: none;
    }

    .back-copy {
      display: block;
      max-width: 280px;
      margin: 10px auto 0;
      color: var(--ink-muted);
      font-size: 1rem;
      font-style: italic;
      line-height: 1.7;
    }

    .back-note {
      display: block;
      max-width: 260px;
      margin: 14px auto 0;
      color: var(--forest);
      font-family: Arial, Helvetica, sans-serif;
      font-size: .72rem;
      letter-spacing: .04em;
      line-height: 1.5;
    }

    .back-swipe-cue {
      display: none;
      margin-top: 22px;
      color: var(--gold);
      font-family: Arial, Helvetica, sans-serif;
      font-size: .63rem;
      font-weight: 700;
      letter-spacing: .17em;
      text-transform: uppercase;
    }

    .back-close-cue {
      display: inline-block;
      margin-top: 28px;
      padding-bottom: 4px;
      color: var(--forest);
      border-bottom: 1px solid var(--gold);
      font-family: Arial, Helvetica, sans-serif;
      font-size: .63rem;
      font-weight: 700;
      letter-spacing: .17em;
      text-transform: uppercase;
    }

    .eyebrow {
      color: var(--gold);
    }

    .inside-title {
      margin: 10px 0 0;
      color: var(--forest);
      font-family: "URW Chancery L", "Apple Chancery", "Segoe Script", cursive;
      font-size: clamp(2.25rem, 7vw, 3.2rem);
      font-weight: 400;
      line-height: 1.04;
    }

    .ornament {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 17px auto;
      color: var(--gold);
      font-size: .75rem;
    }

    .ornament::before,
    .ornament::after {
      width: 62px;
      height: 1px;
      content: "";
      background: linear-gradient(90deg, transparent, rgba(212, 175, 55, .85));
    }

    .ornament::after {
      background: linear-gradient(90deg, rgba(212, 175, 55, .85), transparent);
    }

    .inside-intro {
      max-width: 340px;
      margin: 0 auto 22px;
      color: var(--ink-muted);
      font-size: clamp(.9rem, 2.4vw, 1rem);
      font-style: italic;
      line-height: 1.55;
    }

    .details-grid {
      display: grid;
      gap: 1px;
      overflow: hidden;
      margin: 0 auto;
      border: 1px solid rgba(212, 175, 55, .38);
      border-radius: 12px;
      background: rgba(212, 175, 55, .32);
    }

    .detail {
      padding: 15px 14px 14px;
      background: rgba(246, 240, 228, .72);
    }

    .detail-label {
      display: block;
      margin-bottom: 6px;
      color: rgba(15, 61, 46, .57);
      font-size: .58rem;
    }

    .detail-value {
      display: block;
      color: var(--forest);
      font-family: Arial, Helvetica, sans-serif;
      font-size: .84rem;
      font-weight: 700;
      letter-spacing: .055em;
      line-height: 1.45;
      text-transform: uppercase;
    }

    .detail-value small {
      display: block;
      margin-top: 2px;
      color: var(--ink-muted);
      font-size: .72rem;
      font-weight: 500;
      letter-spacing: .08em;
    }

    .location-link {
      color: inherit;
      text-decoration-color: rgba(212, 175, 55, .7);
      text-decoration-thickness: 1px;
      text-underline-offset: 4px;
    }

    .party-note {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin: 19px 0;
      color: var(--forest);
      font-size: .86rem;
      font-style: italic;
    }

    .party-note::before,
    .party-note::after {
      content: "✦";
      color: var(--gold);
      font-size: .64rem;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .action {
      display: inline-flex;
      min-height: 43px;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 10px 12px;
      border: 1px solid var(--forest);
      border-radius: 999px;
      background: transparent;
      cursor: pointer;
      color: var(--forest);
      font-family: Arial, Helvetica, sans-serif;
      font-size: .62rem;
      font-weight: 800;
      letter-spacing: .13em;
      text-decoration: none;
      text-transform: uppercase;
      transition: transform .2s ease, background-color .2s ease, color .2s ease;
    }

    .action:hover {
      transform: translateY(-2px);
    }

    .action-primary {
      color: var(--paper);
      background: var(--forest);
    }

    .action-secondary:hover {
      background: rgba(212, 175, 55, .13);
    }

    .action svg {
      width: 15px;
      height: 15px;
      flex: 0 0 auto;
    }

    .close-card {
      margin-top: 21px;
      padding: 5px;
      border: 0;
      border-bottom: 1px solid rgba(212, 175, 55, .75);
      background: transparent;
      cursor: pointer;
      color: rgba(15, 61, 46, .63);
      font-family: Arial, Helvetica, sans-serif;
      font-size: .6rem;
      font-weight: 700;
      letter-spacing: .17em;
      text-transform: uppercase;
    }

    .inside-footer {
      margin: 14px 0 0;
      color: rgba(15, 61, 46, .42);
      font-family: Arial, Helvetica, sans-serif;
      font-size: .58rem;
      letter-spacing: .14em;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 980px) {
      :root {
        --card-height: min(680px, calc(100dvh - 42px));
      }

      /* The open spread is two pages wide, so the stage scrolls sideways
         and snaps to one page at a time, read left to right. */
      .stage {
        display: flex;
        align-items: center;
        padding: 21px 23px;
        overflow-x: hidden;
        scrollbar-width: none;
      }

      .stage::-webkit-scrollbar {
        display: none;
      }

      .stage.is-book-open {
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        overscroll-behavior-x: contain;
      }

      .card-scene {
        flex: none;
        width: calc(var(--card-width) * 2);
        margin-inline: auto;
      }

      .card-scene::before,
      .card-scene::after {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 50%;
        content: "";
        pointer-events: none;
        scroll-snap-align: center;
      }

      .card-scene::before {
        left: 0;
      }

      .card-scene::after {
        right: 0;
      }

      .back-swipe-cue {
        display: block;
      }
    }

    @media (max-width: 440px), (max-height: 700px) {
      :root {
        --card-height: calc(100dvh - 30px);
      }

      .stage {
        padding: 15px 23px;
      }

      .card-scene {
        min-height: 540px;
      }

      .cover-front {
        padding-block: 25px 21px;
      }

      .cover-back {
        padding: 26px 24px;
      }

      .back-flourish {
        margin-bottom: 14px;
      }

      .back-drinks {
        max-height: 130px;
        margin-block: 10px 2px;
      }

      .back-copy {
        font-size: .88rem;
        line-height: 1.45;
      }

      .back-note {
        margin-top: 8px;
        font-size: .66rem;
      }

      .back-close-cue {
        margin-top: 14px;
      }

      .dino-art-wrap {
        width: min(100%, 250px);
        margin-block: 5px 8px;
      }

      .dino-art {
        max-height: 225px;
      }

      .open-cue {
        margin-top: 20px;
      }

      .inside-panel {
        padding: 28px 23px 22px;
      }

      .inside-title {
        font-size: 2.2rem;
      }

      .inside-intro {
        margin-bottom: 17px;
      }

      .detail {
        padding-block: 12px;
      }

      .party-note {
        margin-block: 15px;
      }

      .close-card {
        margin-top: 16px;
      }
    }

    @media (max-width: 380px) {
      .cover-front {
        padding-inline: 23px;
      }

      .invite-script {
        font-size: 1.95rem;
      }

      .cover-title {
        font-size: 1.5rem;
      }

      .actions {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <canvas id="confetti" class="confetti-canvas" aria-hidden="true"></canvas>

  <main class="stage">
    <div id="card-scene" class="card-scene">
      <article class="card" aria-label="David Kozdra's 26th birthday invitation">
        <section id="invitation-details" class="panel inside-panel" aria-hidden="true" inert>
          <p class="eyebrow">Dinos &amp; Drinks</p>
          <h1 class="inside-title">Let's get prehistoric!</h1>
          <div class="ornament" aria-hidden="true">◆</div>

          <div class="details-grid">
            <div class="detail">
              <span class="detail-label">Date &amp; time</span>
              <span class="detail-value">Sunday · November 15 · 2026<small>7:00 PM – 10:00 PM</small></span>
            </div>
            <div class="detail">

  <p id="card-status" class="sr-only" aria-live="polite">The invitation is closed.</p>

  <script>window.module = { exports: {} };</script>
  <script src="../../Koz_Engine_Lib/VisualFX/particleSystemCore.js"></script>
  <script>
    window.KozParticleCore = window.module && window.module.exports;
    delete window.module;
  </script>
  <script>
    (() => {
      "use strict";

      const stage = document.querySelector(".stage");
      const scene = document.getElementById("card-scene");
      const cover = document.getElementById("card-cover");
      const details = document.getElementById("invitation-details");
      const closeButton = document.getElementById("close-card");
      const calendarButton = document.getElementById("add-calendar");
      const mapLink = document.getElementById("open-map");
      const status = document.getElementById("card-status");
      const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      let isOpen = false;

      class BirthdayConfetti {
        constructor(canvas, CoreConstructor) {
          this.canvas = canvas;
          this.context = canvas.getContext("2d");
          this.system = CoreConstructor ? new CoreConstructor({ poolSize: 320, maxPoolSize: 640 }) : null;
          this.pixelRatio = 1;
          this.running = false;
          this.lastFrame = 0;
          this.frameRequest = 0;
          this.palette = ["#d4af37", "#f1d98a", "#0f3d2e", "#277356", "#f7f0df", "#e8c765"];
          this.rainEnabled = false;
          this.nextRainAt = 0;
          this.photoReady = false;
          this.photo = new Image();
          this.drinksReady = false;
          this.drinks = new Image();
          this.drinkSprites = [
            { x: 170, y: 70, width: 330, height: 330 },
            { x: 570, y: 20, width: 310, height: 420 },
            { x: 870, y: 50, width: 330, height: 410 },
            { x: 1140, y: 170, width: 290, height: 330 },
            { x: 320, y: 390, width: 330, height: 360 },
            { x: 115, y: 540, width: 280, height: 400 },
            { x: 610, y: 470, width: 260, height: 440 },
            { x: 910, y: 460, width: 330, height: 420 },
            { x: 1170, y: 660, width: 270, height: 290 }
          ];
          this.resize = this.resize.bind(this);
          this.tick = this.tick.bind(this);
          this.photo.onload = () => {
            this.photoReady = true;
            if (this.rainEnabled) {
              this.seedPhotoRain();
              this.ensureRunning();
            }
          };
          this.photo.src = "david-rain.png";
          this.drinks.onload = () => {
            this.drinksReady = true;
          };
          this.drinks.src = "drinks-sprite-sheet.png";
          this.resize();
          window.addEventListener("resize", this.resize, { passive: true });
        }

        resize() {
          this.pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
          this.canvas.width = Math.round(window.innerWidth * this.pixelRatio);
          this.canvas.height = Math.round(window.innerHeight * this.pixelRatio);
          this.canvas.style.width = `${window.innerWidth}px`;
          this.canvas.style.height = `${window.innerHeight}px`;
          this.context.setTransform(this.pixelRatio, 0, 0, this.pixelRatio, 0, 0);
        }

        ensureRunning() {
          if (this.running || !this.system) return;
          this.running = true;
          this.lastFrame = performance.now();
          this.frameRequest = requestAnimationFrame(this.tick);
        }

        startPhotoRain() {
          if (!this.system || prefersReducedMotion.matches) return;
          this.rainEnabled = true;
          this.canvas.classList.add("is-raining");
          this.system.clear();
          this.nextRainAt = performance.now();
          if (this.photoReady) this.seedPhotoRain();
          this.ensureRunning();
        }

        stopPhotoRain() {
          this.rainEnabled = false;
          this.canvas.classList.remove("is-raining");
          if (this.system) this.system.clear();
          this.context.clearRect(0, 0, window.innerWidth, window.innerHeight);
        }

        blowPhotoRainApart(originX, originY) {
          if (!this.system || !this.photoReady || prefersReducedMotion.matches) {
            this.stopPhotoRain();
            return;
          }

          const fallingPhotos = this.system.particles
            .filter((particle) => particle.alive && particle.tag === "photo-rain")
            .map((particle) => ({
              x: particle.x + Math.sin(particle.wobble) * particle.swayAmount,
              y: particle.y,
              width: particle.photoWidth,
              height: particle.photoHeight,
              rotation: particle.rotation,
              alpha: particle.photoAlpha
            }));

          this.rainEnabled = false;
          this.canvas.classList.remove("is-raining");
          this.system.clear();
          this.context.clearRect(0, 0, window.innerWidth, window.innerHeight);

          const sourceWidth = this.photo.naturalWidth / 2;
          const sourceHeight = this.photo.naturalHeight / 2;

          for (const photo of fallingPhotos) {
            const pieceWidth = photo.width / 2;
            const pieceHeight = photo.height / 2;
            const cos = Math.cos(photo.rotation);
            const sin = Math.sin(photo.rotation);

            for (let row = 0; row < 2; row += 1) {
              for (let column = 0; column < 2; column += 1) {
                const localX = (column - .5) * pieceWidth;
                const localY = (row - .5) * pieceHeight;
                const x = photo.x + localX * cos - localY * sin;
                const y = photo.y + localX * sin + localY * cos;
                const distanceX = x - originX;
                const distanceY = y - originY;
                const distance = Math.hypot(distanceX, distanceY) || 1;
                const outwardX = distanceX / distance;
                const outwardY = distanceY / distance;
                const localLength = Math.hypot(localX, localY) || 1;
                const piece = this.system.spawn(x, y, {
                  vx: outwardX * (170 + Math.random() * 180) + localX / localLength * 125,
                  vy: outwardY * (140 + Math.random() * 150) + localY / localLength * 105 - 75,
                  life: 850 + Math.random() * 650,
                  size: pieceWidth,
                  color: "#54239b",
                  drag: .975,
                  gravity: 380,
                  tag: "photo-fragment"
                });

                piece.sourceX = column * sourceWidth;
                piece.sourceY = row * sourceHeight;
                piece.sourceWidth = sourceWidth;
                piece.sourceHeight = sourceHeight;
                piece.fragmentWidth = pieceWidth;
                piece.fragmentHeight = pieceHeight;
                piece.fragmentAlpha = Math.min(1, photo.alpha + .35);
                piece.rotation = photo.rotation;
                piece.rotationSpeed = (Math.random() - .5) * .16;
                piece.wobble = 0;
              }
            }
          }

          this.ensureRunning();
        }

        seedPhotoRain() {
          const startingPhotos = Math.max(10, Math.min(20, Math.round(window.innerWidth / 90)));
          for (let index = 0; index < startingPhotos; index += 1) {
            this.spawnPhotoRain(true);
          }
        }

        spawnPhotoRain(fillViewport = false) {
          if (!this.system || !this.photoReady || !this.rainEnabled) return;
          const width = 72 + Math.random() * 62;
          const particle = this.system.spawn(
            Math.random() * window.innerWidth,
            fillViewport ? Math.random() * window.innerHeight : -width,
            {
              vx: (Math.random() - .5) * 22,
              vy: 62 + Math.random() * 58,
              life: 18000 + Math.random() * 5000,
              size: width,
              color: "#54239b",
              drag: 1,
              gravity: 3 + Math.random() * 5,
              tag: "photo-rain"
            }
          );

          particle.photoWidth = width;
          particle.photoHeight = width / 1.4;
          particle.photoAlpha = .28 + Math.random() * .22;
          particle.rotation = (Math.random() - .5) * .12;
          particle.rotationSpeed = (Math.random() - .5) * .00018;
          particle.wobble = Math.random() * Math.PI * 2;
          particle.wobbleSpeed = .00045 + Math.random() * .0004;
          particle.swayAmount = 3 + Math.random() * 4;
        }

        spawnDrinkConfetti(x, y) {
          const sprite = this.drinkSprites[Math.floor(Math.random() * this.drinkSprites.length)];
          const angle = Math.random() * Math.PI * 2;
          const speed = 130 + Math.random() * 390;
          const height = 42 + Math.random() * 46;
          const particle = this.system.spawn(
            x + (Math.random() - .5) * 34,
            y + (Math.random() - .5) * 24,
            {
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed - 245,
              life: 1900 + Math.random() * 1300,
              size: height,
              color: "#f7f0df",
              drag: .987,
              gravity: 610,
              tag: "drink-confetti"
            }
          );

          particle.sourceX = sprite.x;
          particle.sourceY = sprite.y;
          particle.sourceWidth = sprite.width;
          particle.sourceHeight = sprite.height;
          particle.drinkHeight = height;
          particle.drinkWidth = height * (sprite.width / sprite.height);
          particle.rotation = Math.random() * Math.PI * 2;
          particle.rotationSpeed = (Math.random() - .5) * .0014;
        }

        burst(x, y, count = 150) {
          if (!this.system || prefersReducedMotion.matches) return;

          const drinkCount = this.drinksReady ? Math.max(8, Math.round(count * .34)) : 0;

          for (let index = 0; index < drinkCount; index += 1) {
            this.spawnDrinkConfetti(x, y);
          }

          for (let index = drinkCount; index < count; index += 1) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 150 + Math.random() * 480;
            const particle = this.system.spawn(
              x + (Math.random() - .5) * 34,
              y + (Math.random() - .5) * 24,
              {
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed - 215,
                life: 1750 + Math.random() * 1350,
                size: 5 + Math.random() * 9,
                color: this.palette[Math.floor(Math.random() * this.palette.length)],
                drag: .985,
                gravity: 720,
                tag: "birthday-confetti"
              }
            );

            particle.shape = Math.floor(Math.random() * 3);
            particle.rotation = Math.random() * Math.PI * 2;
            particle.rotationSpeed = (Math.random() - .5) * .35;
            particle.wobble = Math.random() * Math.PI * 2;
          }

          this.ensureRunning();
        }

        tick(time) {
          if (!this.system) return;
          const elapsed = Math.min(34, Math.max(0, time - this.lastFrame));
          this.lastFrame = time;
          this.system.update(elapsed);

          if (this.rainEnabled && this.photoReady && time >= this.nextRainAt) {
            this.spawnPhotoRain(false);
            this.nextRainAt = time + 170 + Math.random() * 170;
          }

          this.context.clearRect(0, 0, window.innerWidth, window.innerHeight);

          for (const particle of this.system.particles) {
            if (!particle.alive) continue;

            if (particle.tag === "photo-rain") {
              particle.rotation += particle.rotationSpeed * elapsed;
              particle.wobble += particle.wobbleSpeed * elapsed;

              if (particle.y - particle.photoHeight / 2 > window.innerHeight + 40) {
                particle.life = 0;
                continue;
              }

              this.context.save();
              this.context.globalAlpha = Math.min(particle.photoAlpha, particle.alpha);
              this.context.translate(
                particle.x + Math.sin(particle.wobble) * particle.swayAmount,
                particle.y
              );
              this.context.rotate(particle.rotation);
              this.context.drawImage(
                this.photo,
                -particle.photoWidth / 2,
                -particle.photoHeight / 2,
                particle.photoWidth,
                particle.photoHeight
              );
              this.context.strokeStyle = "rgba(255, 253, 247, .72)";
              this.context.lineWidth = 1;
              this.context.strokeRect(
                -particle.photoWidth / 2,
                -particle.photoHeight / 2,
                particle.photoWidth,
                particle.photoHeight
              );
              this.context.restore();
              continue;
            }

            if (particle.tag === "photo-fragment") {
              particle.rotation += particle.rotationSpeed;
              this.context.save();
              this.context.globalAlpha = Math.min(particle.fragmentAlpha, particle.alpha);
              this.context.translate(particle.x, particle.y);
              this.context.rotate(particle.rotation);
              this.context.drawImage(
                this.photo,
                particle.sourceX,
                particle.sourceY,
                particle.sourceWidth,
                particle.sourceHeight,
                -particle.fragmentWidth / 2,
                -particle.fragmentHeight / 2,
                particle.fragmentWidth,
                particle.fragmentHeight
              );
              this.context.restore();
              continue;
            }

            if (particle.tag === "drink-confetti") {
              particle.rotation += particle.rotationSpeed * elapsed;
              this.context.save();
              this.context.globalAlpha = Math.min(1, particle.alpha * 1.35);
              this.context.translate(particle.x, particle.y);
              this.context.rotate(particle.rotation);
              this.context.drawImage(
                this.drinks,
                particle.sourceX,
                particle.sourceY,
                particle.sourceWidth,
                particle.sourceHeight,
                -particle.drinkWidth / 2,
                -particle.drinkHeight / 2,
                particle.drinkWidth,
                particle.drinkHeight
              );
              this.context.restore();
              continue;
            }

            particle.rotation += particle.rotationSpeed;
            particle.wobble += .12;

            const squash = .28 + Math.abs(Math.cos(particle.wobble)) * .72;
            const width = particle.size * 1.55;
            const height = particle.size * squash;

            this.context.save();
            this.context.globalAlpha = Math.min(1, particle.alpha * 1.25);
            this.context.translate(particle.x, particle.y);
            this.context.rotate(particle.rotation);
            this.context.fillStyle = particle.color;

            if (particle.shape === 0) {
              this.context.fillRect(-width / 2, -height / 2, width, height);
            } else if (particle.shape === 1) {
              this.context.beginPath();
              this.context.ellipse(0, 0, particle.size * .55, particle.size * .35 * squash, 0, 0, Math.PI * 2);
              this.context.fill();
            } else {
              this.context.beginPath();
              this.context.moveTo(0, -particle.size * .7);
              this.context.lineTo(particle.size * .62, particle.size * .5);
              this.context.lineTo(-particle.size * .62, particle.size * .5);
              this.context.closePath();
              this.context.fill();
            }

            this.context.restore();
          }

          if (this.system.activeCount() > 0 || this.rainEnabled) {
            this.frameRequest = requestAnimationFrame(this.tick);
          } else {
            this.running = false;
            this.context.clearRect(0, 0, window.innerWidth, window.innerHeight);
          }
        }
      }

      const confetti = new BirthdayConfetti(
        document.getElementById("confetti"),
        window.KozParticleCore && window.KozParticleCore.ParticleSystemCore
      );
      confetti.startPhotoRain();

      function celebrate(origin, count) {
        const rect = origin.getBoundingClientRect();
        confetti.burst(rect.left + rect.width / 2, rect.top + rect.height * .36, count);
      }

      // On narrow screens the open spread is wider than the stage. Opened, it
      // starts on the left page like a book; closed, the cover sits centered.
      function alignBook(smooth) {
        const overflow = stage.scrollWidth - stage.clientWidth;
        if (overflow <= 0) return;
        stage.scrollTo({
          left: isOpen ? 0 : overflow / 2,
          behavior: smooth && !prefersReducedMotion.matches ? "smooth" : "auto"
        });
      }

      function setCardOpen(nextOpen) {
        if (isOpen === nextOpen) return;
        isOpen = nextOpen;
        scene.classList.toggle("is-open", isOpen);
        stage.classList.toggle("is-book-open", isOpen);
        alignBook(true);
        cover.setAttribute("aria-expanded", String(isOpen));
        cover.setAttribute("aria-label", isOpen ? "Close David's birthday invitation" : "Open David's birthday invitation");
        details.toggleAttribute("inert", !isOpen);
        details.setAttribute("aria-hidden", String(!isOpen));
        status.textContent = isOpen ? "The invitation is open. Birthday details are now available." : "The invitation is closed.";

        if (isOpen) {
          const sceneRect = scene.getBoundingClientRect();
          confetti.blowPhotoRainApart(
            sceneRect.left + sceneRect.width / 2,
            sceneRect.top + sceneRect.height / 2
          );
          window.setTimeout(() => {
            if (isOpen) celebrate(scene, 175);
          }, prefersReducedMotion.matches ? 0 : 430);
        } else {
          confetti.startPhotoRain();
        }
      }

      alignBook(false);
      window.addEventListener("resize", () => {
        if (!isOpen) alignBook(false);
      });

      cover.addEventListener("click", () => {
        setCardOpen(!isOpen);
      });

      closeButton?.addEventListener("click", () => {
        setCardOpen(false);
        cover.focus({ preventScroll: true });
      });

      calendarButton.addEventListener("click", () => {
        celebrate(calendarButton, 80);
      });

      mapLink.addEventListener("click", () => {
        celebrate(mapLink, 55);
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && isOpen) {
          setCardOpen(false);
          cover.focus({ preventScroll: true });
        }
      });
    })();
  </script>
