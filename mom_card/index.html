<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>For Karen</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23fff6f7'/%3E%3Cg fill='%23d86a8a'%3E%3Ccircle cx='32' cy='16' r='9'/%3E%3Ccircle cx='48' cy='32' r='9'/%3E%3Ccircle cx='32' cy='48' r='9'/%3E%3Ccircle cx='16' cy='32' r='9'/%3E%3C/g%3E%3Ccircle cx='32' cy='32' r='8' fill='%23ffd166'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="flower-rain" aria-hidden="true"></div>
    <div class="sparkle-layer" aria-hidden="true"></div>
    <p class="page-greeting" aria-hidden="true">Happy Mother's Day</p>

    <main
      class="card"
      role="button"
      tabindex="0"
      aria-expanded="false"
      aria-label="Dedication card for Karen Kozdra. Click to open or close."
    >
      <div class="card-flip">
        <section class="card-face card-front" aria-label="Front of card">
          <div class="photo">
            <img
              src="cat.jpg"
              alt="Black and white cat curled in pink stroller"
            />
          </div>

          <p class="hint">Tap card to open</p>

          <p class="to">To Karen, my mom,</p>
        </section>

        <section class="card-face card-back" aria-label="Inside message">
          <p class="to">To Karen, my mom,</p>

          <div class="message">
            <p id="title">Thank you for being so strong</p>
            <p>Everyone in my whole life has</p>
            <p>reminded me how much you try</p>
            <p>in the struggle of life</p>
            <p>God bless.</p>
          </div>

          <div class="divider" aria-hidden="true">
            <svg
              width="140"
              height="28"
              viewBox="0 0 140 28"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path class="divider-line" d="M2 14 H54 M86 14 H138" />
              <g transform="translate(70 14)">
                <circle class="divider-flower" cx="0" cy="0" r="2.5" />
                <circle class="divider-flower" cx="-6.5" cy="0" r="1.8" opacity="0.7" />
                <circle class="divider-flower" cx="6.5" cy="0" r="1.8" opacity="0.7" />
                <circle class="divider-flower" cx="0" cy="-6" r="1.6" opacity="0.55" />
                <circle class="divider-flower" cx="0" cy="6" r="1.6" opacity="0.55" />
                <circle class="divider-flower" cx="-4.5" cy="-4.5" r="1.2" opacity="0.4" />
                <circle class="divider-flower" cx="4.5" cy="-4.5" r="1.2" opacity="0.4" />
                <circle class="divider-flower" cx="-4.5" cy="4.5" r="1.2" opacity="0.4" />
                <circle class="divider-flower" cx="4.5" cy="4.5" r="1.2" opacity="0.4" />
              </g>
            </svg>
          </div>

          <p class="from">From David Kozdra, your son</p>
        </section>
      </div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
